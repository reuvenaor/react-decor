# Cloudflare deploy config for the react-decor documentation site.
#
# Deployed as a Cloudflare WORKER serving STATIC ASSETS (no Worker code — the React Router 7
# SPA, ssr:false + prerendered, is prebuilt to build/client and uploaded as the Worker's
# assets). `wrangler deploy` needs the [assets] directory below — NOT the Pages-only
# `pages_build_output_dir`, which `wrangler deploy` ignores.
#
# Deployed via Cloudflare Workers Builds (GitHub-connected: every push to main
# builds + deploys). Dashboard settings for this monorepo:
#   Root directory:  /                (workspace install must run at the repo root)
#   Build command:   npm ci && npm run build -w examples/react-router
#   Deploy command:  npx wrangler deploy --config examples/react-router/wrangler.toml
#   Build env var:   NODE_VERSION=22
# Manual fallback (rarely needed): npx wrangler deploy --config examples/react-router/wrangler.toml
name = "react-decor-docs"
compatibility_date = "2026-10-10"

# Custom domains (zone lives in the same Cloudflare account): wrangler provisions
# DNS records + certificates for these automatically on deploy.
routes = [
  { pattern = "react-decor.com", custom_domain = true },
  { pattern = "www.react-decor.com", custom_domain = true },
]

[assets]
directory = "./build/client"
# SPA fallback: serve index.html for any unknown client route so React Router can client-route it.
# Do NOT add a `_redirects` catch-all (e.g. `/* /__spa-fallback.html 200`) here — combined with
# Cloudflare's automatic .html handling it causes a /__spa-fallback redirect loop. `not_found_handling`
# is the correct SPA fallback mechanism for Workers static assets.
not_found_handling = "single-page-application"
