# Publishes react-decor + react-decor-ts-plugin to npm with provenance.
#
# Inert until both of these exist:
#   - an NPM_TOKEN repository secret (npm automation token)
#   - a v* tag push (real publish) or a manual dispatch (defaults to dry-run)
#
# Release procedure: bump both package versions + CHANGELOG.md, run
# `npm run lib:pack`, commit, then `git tag vX.Y.Z && git push --tags`.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'npm publish --dry-run only'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # npm --provenance (OIDC)

jobs:
  publish:
    # Owner-based (not repo-slug) so a repo rename can never silently no-op the
    # release again — forks still skip. Update on an ownership transfer.
    if: github.repository_owner == 'reuvenaor'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      # A forgotten bump must die here, not ship 0.x under a newer tag (or E403
      # at the last step after the whole verify chain).
      - name: Verify tag matches both package versions
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          node -e '
            const tag = process.env.GITHUB_REF_NAME.replace(/^v/, "")
            const lib = require("./lib/react-decor/package.json").version
            const plugin = require("./lib/react-decor/ts-plugin/package.json").version
            if (tag !== lib || tag !== plugin) {
              console.error(`tag v${tag} does not match react-decor@${lib} / react-decor-ts-plugin@${plugin}`)
              process.exit(1)
            }
            console.log(`tag v${tag} matches both package versions`)
          '

      - run: npm ci

      # CI verifies the installed vendor tarballs; publish ships lib SOURCE.
      # Refuse to release when they have drifted (lib edited without lib:pack).
      - run: npm run verify:vendor

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run test

      # react-decor first — the ts-plugin depends on it by version range.
      - name: Publish react-decor
        run: npm publish ./lib/react-decor --provenance --access public ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish react-decor-ts-plugin
        run: npm publish ./lib/react-decor/ts-plugin --provenance --access public ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
